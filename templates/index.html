<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber YT Music Player</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: #121620;
            --bg-input: #1a202c;
            --border-color: #2a3447;
            --cyan: #00f3ff;
            --pink: #ff007f;
            --text-primary: #f0f4f8;
            --text-muted: #8a99ad;
            --glow-cyan: 0 0 15px rgba(0, 243, 255, 0.3);
            --glow-pink: 0 0 15px rgba(255, 0, 127, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        .cyber-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .logo {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .text-cyan { color: var(--cyan); }
        .text-pink { color: var(--pink); }

        .status-badge {
            font-size: 0.75rem;
            color: var(--cyan);
            background: rgba(0, 243, 255, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--cyan);
            border-radius: 50%;
            box-shadow: var(--glow-cyan);
        }

        /* Input Section */
        .input-group {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.5rem;
            gap: 0.5rem;
        }

        .input-icon {
            color: var(--text-muted);
            padding-left: 0.75rem;
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        /* Buttons */
        .cyber-btn {
            border: none;
            outline: none;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .cyber-btn.primary {
            background: var(--cyan);
            color: #000;
            padding: 0.6rem 1.25rem;
        }

        .cyber-btn.primary:hover {
            box-shadow: var(--glow-cyan);
            transform: translateY(-1px);
        }

        .cyber-btn.secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1rem;
        }

        .cyber-btn.icon-only {
            width: 42px;
            height: 42px;
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .cyber-btn.icon-only.active {
            color: var(--pink);
            border-color: var(--pink);
            box-shadow: var(--glow-pink);
        }

        /* Grid Layout */
        .player-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        @media (min-width: 850px) {
            .player-grid {
                grid-template-columns: 1.4fr 1fr;
            }
        }

        /* Cards */
        .player-card, .playlist-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        /* YouTube Embedded Player Wrapper */
        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .iframe-wrapper iframe, .iframe-wrapper #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Track Details */
        .track-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .track-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }

        .track-author {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: var(--bg-main);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .time-control {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .time-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 35px;
            font-family: monospace;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--cyan);
            height: 4px;
            background: var(--bg-input);
            border-radius: 4px;
            cursor: pointer;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
        }

        .main-play-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            font-size: 1.2rem;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
        }

        /* Playlist Section */
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .playlist-header h3 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .count-badge {
            font-size: 0.75rem;
            background: var(--bg-input);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            color: var(--text-muted);
        }

        .playlist-items {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 420px;
            overflow-y: auto;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 3rem 1rem;
            font-size: 0.85rem;
        }

        .empty-state i {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            color: var(--border-color);
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .playlist-item:hover {
            border-color: var(--cyan);
        }

        .playlist-item.active {
            border-color: var(--pink);
            box-shadow: var(--glow-pink);
        }

        .playlist-item img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
        }

        .item-info {
            flex: 1;
            overflow: hidden;
        }

        .item-title {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-author {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .delete-item-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
        }

        .delete-item-btn:hover {
            color: var(--pink);
        }
    </style>
</head>
<body>

    <div class="cyber-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-bolt text-cyan"></i>
                <span>CYBER<span class="text-pink">YT</span></span>
            </div>
            <div class="status-badge">
                <span class="pulse-dot"></span> COMPLIANT EMBED
            </div>
        </header>

        <!-- Search / URL Input -->
        <section class="input-section">
            <div class="input-group">
                <i class="fa-solid fa-link input-icon"></i>
                <input type="text" id="urlInput" placeholder="Paste YouTube URL or Video ID..." autocomplete="off">
                <button id="loadBtn" class="cyber-btn primary">
                    <i class="fa-solid fa-play"></i> LOAD
                </button>
            </div>
        </section>

        <!-- Main Content Area -->
        <main class="player-grid">
            
            <!-- Player Card -->
            <div class="player-card">
                <!-- YouTube IFrame Container -->
                <div class="iframe-wrapper">
                    <div id="player"></div>
                </div>

                <!-- Track Info -->
                <div class="track-info">
                    <div class="track-details">
                        <h2 id="trackTitle" class="track-title">Loading...</h2>
                        <p id="trackAuthor" class="track-author">YouTube Music Player</p>
                    </div>
                    <button id="favoriteBtn" class="cyber-btn icon-only" title="Save to Playlist">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </div>

                <!-- Custom Player Controls -->
                <div class="control-panel">
                    
                    <!-- Progress Bar -->
                    <div class="time-control">
                        <span id="currentTime" class="time-text">0:00</span>
                        <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1">
                        <span id="totalTime" class="time-text">0:00</span>
                    </div>

                    <!-- Action Buttons -->
                    <div class="action-buttons">
                        <button id="prevBtn" class="cyber-btn secondary icon-btn" title="Previous Track">
                            <i class="fa-solid fa-backward"></i>
                        </button>
                        
                        <button id="playPauseBtn" class="cyber-btn primary main-play-btn">
                            <i class="fa-solid fa-play" id="playIcon"></i>
                        </button>
                        
                        <button id="nextBtn" class="cyber-btn secondary icon-btn" title="Next Track">
                            <i class="fa-solid fa-forward"></i>
                        </button>
                    </div>

                    <!-- Volume Control -->
                    <div class="volume-control">
                        <button id="muteBtn" class="cyber-btn icon-only">
                            <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
                        </button>
                        <input type="range" id="volumeSlider" min="0" max="100" value="100">
                    </div>

                </div>
            </div>

            <!-- Playlist Card -->
            <div class="playlist-card">
                <div class="playlist-header">
                    <h3><i class="fa-solid fa-list-ul"></i> SAVED PLAYLIST</h3>
                    <span id="playlistCount" class="count-badge">0 tracks</span>
                </div>
                
                <div id="playlistItems" class="playlist-items">
                    <div class="empty-state">
                        <i class="fa-solid fa-compact-disc"></i>
                        <p>Your playlist is empty.<br>Save tracks using the heart icon.</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <script>
        let ytPlayer = null;
        let isSeeking = false;
        let updateTimer = null;
        let currentTrack = null;
        let localPlaylist = [];

        // DOM Elements
        const urlInput = document.getElementById('urlInput');
        const loadBtn = document.getElementById('loadBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const seekSlider = document.getElementById('seekSlider');
        const volumeSlider = document.getElementById('volumeSlider');
        const muteBtn = document.getElementById('muteBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const trackTitle = document.getElementById('trackTitle');
        const trackAuthor = document.getElementById('trackAuthor');
        const favoriteBtn = document.getElementById('favoriteBtn');
        const playlistItems = document.getElementById('playlistItems');
        const playlistCount = document.getElementById('playlistCount');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        /* ===============================
           YOUTUBE IFRAME API CALLBACK
        ================================ */
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: '8ghwNVm4VjY', // Default initial video ID
                playerVars: {
                    'playsinline': 1,
                    'autoplay': 0,
                    'controls': 1,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            updateVolumeIcon(ytPlayer.getVolume());
            fetchPlaylist();
            fetchTrackInfo('8ghwNVm4VjY');
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                playIcon.className = 'fa-solid fa-pause';
                startSeekTimer();
            } else {
                playIcon.className = 'fa-solid fa-play';
                stopSeekTimer();
            }

            if (event.data === YT.PlayerState.ENDED) {
                playNextTrack();
            }
        }

        /* ===============================
           URL & ID EXTRACTION
        ================================ */
        function extractVideoID(input) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = input.match(regExp);
            return (match && match[2].length === 11) ? match[2] : input.trim();
        }

        /* ===============================
           PLAYER & SEEKING
        ================================ */
        function loadAndPlayVideo(videoID) {
            if (!ytPlayer) return;
            ytPlayer.loadVideoById(videoID);
            fetchTrackInfo(videoID);
        }

        function startSeekTimer() {
            stopSeekTimer();
            updateTimer = setInterval(() => {
                if (!isSeeking && ytPlayer && ytPlayer.getCurrentTime) {
                    const current = ytPlayer.getCurrentTime() || 0;
                    const duration = ytPlayer.getDuration() || 0;
                    
                    seekSlider.max = duration;
                    seekSlider.value = current;
                    
                    currentTimeEl.textContent = formatTime(current);
                    totalTimeEl.textContent = formatTime(duration);
                }
            }, 500);
        }

        function stopSeekTimer() {
            if (updateTimer) clearInterval(updateTimer);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        /* ===============================
           FETCH TRACK METADATA (OEMBED)
        ================================ */
        async function fetchTrackInfo(videoID) {
            try {
                const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoID}`);
                const data = await response.json();
                
                currentTrack = {
                    id: videoID,
                    title: data.title || 'YouTube Track',
                    author: data.author_name || 'YouTube Creator',
                    thumbnail: `https://img.youtube.com/vi/${videoID}/hqdefault.jpg`
                };

                trackTitle.textContent = currentTrack.title;
                trackAuthor.textContent = currentTrack.author;
                
                updateFavoriteButtonState();
                highlightActiveTrack(videoID);
            } catch (e) {
                currentTrack = {
                    id: videoID,
                    title: 'YouTube Track',
                    author: 'Unknown Artist',
                    thumbnail: `https://img.youtube.com/vi/${videoID}/hqdefault.jpg`
                };
                trackTitle.textContent = "YouTube Track (" + videoID + ")";
            }
        }

        /* ===============================
           FLASK BACKEND API INTEGRATION
        ================================ */
        async function fetchPlaylist() {
            try {
                const res = await fetch('/api/playlist');
                localPlaylist = await res.json();
                renderPlaylist();
            } catch (e) {
                console.error("Failed to load playlist from Flask API", e);
            }
        }

        async function toggleFavorite() {
            if (!currentTrack) return;
            
            const exists = localPlaylist.some(item => item.id === currentTrack.id);
            
            if (exists) {
                await fetch(`/api/playlist?id=${encodeURIComponent(currentTrack.id)}`, { method: 'DELETE' });
            } else {
                await fetch('/api/playlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentTrack)
                });
            }
            fetchPlaylist();
        }

        function updateFavoriteButtonState() {
            if (!currentTrack) return;
            const isFav = localPlaylist.some(item => item.id === currentTrack.id);
            const icon = favoriteBtn.querySelector('i');
            
            if (isFav) {
                favoriteBtn.classList.add('active');
                icon.className = 'fa-solid fa-heart';
            } else {
                favoriteBtn.classList.remove('active');
                icon.className = 'fa-regular fa-heart';
            }
        }

        function renderPlaylist() {
            playlistCount.textContent = `${localPlaylist.length} tracks`;
            updateFavoriteButtonState();

            if (localPlaylist.length === 0) {
                playlistItems.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-compact-disc"></i>
                        <p>Your playlist is empty.<br>Save tracks using the heart icon.</p>
                    </div>`;
                return;
            }

            playlistItems.innerHTML = localPlaylist.map(track => `
                <div class="playlist-item ${currentTrack && currentTrack.id === track.id ? 'active' : ''}" data-id="${track.id}">
                    <img src="${track.thumbnail}" alt="thumb">
                    <div class="item-info">
                        <div class="item-title">${escapeHtml(track.title)}</div>
                        <div class="item-author">${escapeHtml(track.author)}</div>
                    </div>
                    <button class="delete-item-btn" onclick="event.stopPropagation(); removeTrack('${track.id}')">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');

            document.querySelectorAll('.playlist-item').forEach(item => {
                item.addEventListener('click', () => {
                    const id = item.getAttribute('data-id');
                    loadAndPlayVideo(id);
                });
            });
        }

        async function removeTrack(id) {
            await fetch(`/api/playlist?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
            fetchPlaylist();
        }

        function highlightActiveTrack(videoID) {
            document.querySelectorAll('.playlist-item').forEach(item => {
                if (item.getAttribute('data-id') === videoID) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function playNextTrack() {
            if (!localPlaylist.length || !currentTrack) return;
            const currentIndex = localPlaylist.findIndex(t => t.id === currentTrack.id);
            const nextIndex = (currentIndex + 1) % localPlaylist.length;
            loadAndPlayVideo(localPlaylist[nextIndex].id);
        }

        function playPrevTrack() {
            if (!localPlaylist.length || !currentTrack) return;
            const currentIndex = localPlaylist.findIndex(t => t.id === currentTrack.id);
            const prevIndex = (currentIndex - 1 + localPlaylist.length) % localPlaylist.length;
            loadAndPlayVideo(localPlaylist[prevIndex].id);
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        /* ===============================
           EVENT LISTENERS
        ================================ */
        loadBtn.addEventListener('click', () => {
            const id = extractVideoID(urlInput.value);
            if (id) loadAndPlayVideo(id);
        });

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const id = extractVideoID(urlInput.value);
                if (id) loadAndPlayVideo(id);
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (!ytPlayer) return;
            const state = ytPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                ytPlayer.pauseVideo();
            } else {
                ytPlayer.playVideo();
            }
        });

        seekSlider.addEventListener('mousedown', () => isSeeking = true);
        seekSlider.addEventListener('touchstart', () => isSeeking = true);
        seekSlider.addEventListener('change', () => {
            if (ytPlayer) {
                ytPlayer.seekTo(seekSlider.value, true);
            }
            isSeeking = false;
        });

        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            if (ytPlayer) {
                ytPlayer.setVolume(val);
                if (val > 0 && ytPlayer.isMuted()) ytPlayer.unMute();
            }
            updateVolumeIcon(val);
        });

        muteBtn.addEventListener('click', () => {
            if (!ytPlayer) return;
            if (ytPlayer.isMuted()) {
                ytPlayer.unMute();
                updateVolumeIcon(ytPlayer.getVolume());
            } else {
                ytPlayer.mute();
                updateVolumeIcon(0);
            }
        });

        function updateVolumeIcon(vol) {
            if (vol == 0 || (ytPlayer && ytPlayer.isMuted())) {
                volumeIcon.className = 'fa-solid fa-volume-xmark';
            } else if (vol < 50) {
                volumeIcon.className = 'fa-solid fa-volume-low';
            } else {
                volumeIcon.className = 'fa-solid fa-volume-high';
            }
        }

        favoriteBtn.addEventListener('click', toggleFavorite);
        nextBtn.addEventListener('click', playNextTrack);
        prevBtn.addEventListener('click', playPrevTrack);

        /* ===============================
           KEYBOARD SHORTCUTS
        ================================ */
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

            if (e.code === 'Space') {
                e.preventDefault();
                playPauseBtn.click();
            } else if (e.key.toLowerCase() === 'm') {
                muteBtn.click();
            } else if (e.key === 'ArrowRight') {
                if (ytPlayer) ytPlayer.seekTo(ytPlayer.getCurrentTime() + 5, true);
            } else if (e.key === 'ArrowLeft') {
                if (ytPlayer) ytPlayer.seekTo(ytPlayer.getCurrentTime() - 5, true);
            }
        });
    </script>
</body>
  </html>
